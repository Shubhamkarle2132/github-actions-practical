
name: Every 5 Minutes Workflow

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  scheduled-job:
    runs-on: ubuntu-latest

    steps:
      - name: Print welcome message
        run: echo "Scheduled GitHub Actions workflow is running!"

      - name: Print date and time
        run: date

      - name: Print working directory
        run: pwd
